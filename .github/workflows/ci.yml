name: Application Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      SAM_CLI_TELEMETRY: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt aws-sam-cli cfn-lint

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Check workflow JSON syntax
        run: python -m json.tool statemachine/onboarding.asl.json > /dev/null

      - name: Lint infrastructure template
        run: cfn-lint template.yaml

      - name: Build Lambda application packages
        run: sam build --template-file template.yaml
